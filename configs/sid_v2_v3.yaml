# SID Tokenizer v3 — 컬리/LETTER paper 비교에서 식별된 개선 통합 (LETTER 없이)
#
# v2 대비 변경 (모두 backward-compat 옵션)
#   A1. use_attributes=True → item_attributes.parquet 의 value_sno multi-hot 임베딩 추가
#   A2. aux_category_weight > 0 → encoder latent 위 카테고리 분류 head + CE loss
#   A3. use_popularity_bias_pairs=True → pair 추출 시 inv-freq 가중 샘플링
#
# 산출: meta_v3/item_to_sid.parquet (TIGER-lite v7 가 사용)
# LETTER 변형(sid_v2_letter.yaml) 의 baseline 역할도 한다.

name: sid_v2
version: v3

seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 50
  deterministic: false
  num_sanity_val_steps: 0
  enable_progress_bar: true
  log_every_n_steps: 50
  callbacks:
    - class_path: SaveSIDMapCallback
      init_args:
        output_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full/meta_v3

model:
  class_path: SIDTokenizerModel
  init_args:
    # === v2 와 동일 ===
    latent_dim: 384
    codebook_sizes: [2048, 1024, 512]
    text_dim: 512
    image_dim: 0
    cat_emb_dim: 64
    brand_emb_dim: 48
    num_price_buckets: 10
    price_emb_dim: 16
    content_out_dim: 512
    recon_weight: 1.0
    vq_weight: 1.0
    co_weight: 0.5
    co_temperature: 0.07
    encoder_hidden: [768, 384]
    decoder_hidden: [384, 768]
    dropout: 0.1
    commitment_cost: 0.25
    ema_decay: 0.95
    lr: 0.001
    weight_decay: 0.0
    warmup_epochs: 3
    eta_min: 0.00001
    # === v3 신규 ===
    attribute_emb_dim: 32
    max_attributes_per_item: 16
    aux_category_weight: 0.2          # encoder latent → category 분류 regularizer

data:
  class_path: SIDTokenizerDataModule
  init_args:
    base_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full
    num_pairs_per_user: 8
    max_train_pairs: 20_000_000
    num_price_buckets: 10
    batch_size: 16384
    test_batch_size: 8192
    num_workers: 4
    seed: 42
    # === v3 신규 ===
    use_attributes: true              # item_attributes.parquet 로드
    max_attributes_per_item: 16
    use_popularity_bias_pairs: true   # inv-freq 가중 pair 선택

early_stopping:
  monitor: val/sid_uniqueness
  patience: 8
  mode: max

model_ckpt:
  monitor: val/sid_uniqueness
  mode: max
  filename: "best_sid_tokenizer_v3"
  auto_insert_metric_name: false
  save_weights_only: true
  save_top_k: 1
