name: complement
version: v1

seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 10
  deterministic: true
  num_sanity_val_steps: 0
  enable_progress_bar: true

model:
  class_path: ComplementModel
  init_args:
    top_k: 50
    negative_sampling: false
    num_hidden_layers: 1
    last_hidden_units: 256
    item_dropout_prob: 0.0
    optimizer_params:
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      lr_scheduler: null

data:
  class_path: ComplementDataModule
  init_args:
    raw_dataset_root: /home/jeongmindo/projects/ably/data/complement/20260407/interaction
    pretrained_root: /home/jeongmindo/projects/ably/data/pretrained_text
    sql_dataset_root: /home/jeongmindo/projects/ably/data/sql
    model_path: /home/jeongmindo/projects/ably/data/output/complement
    goods_filename: /home/jeongmindo/projects/ably/data/sql/goods.csv
    category_filename: /home/jeongmindo/projects/ably/data/sql/category.csv
    standard_category_filename: /home/jeongmindo/projects/ably/data/sql/standard_category.csv
    user_filename: /home/jeongmindo/projects/ably/data/sql/member.csv
    min_actions_per_user: 50
    max_items: 400000
    max_interaction_items: 180000
    max_ordered_items: 300000
    batch_size: 256
    test_batch_size: 256
    max_len: 100
    num_workers: 0
    drop_last_batch: true
    item_embed_size: 256
    item_vocabulary_size: 400000
    use_age_info: true
    use_in_house_text_embed: true
    use_item_emb_in_item_tower: true
    use_attr: true
    attr_meta_filename: /home/jeongmindo/projects/ably/data/sql/goods_attribute_field_values.csv
    attr_filename: /home/jeongmindo/projects/ably/data/sql/goods_attribute_values.csv
    market_embed_size: 64
    category_embed_size: 64
    negative_sampling: false
    max_test_samples: 200000
    num_test_samples_per_user: 10
    dataloader_random_seed: 0.0
    deny_condition_min_click: 30000
    deny_condition_events_per_click: 0.02
    save_preprocessed_data: false

early_stopping:
  monitor: val/NDCG_50
  patience: 20
  mode: max

model_ckpt:
  monitor: val/NDCG_50
  mode: max
  filename: "best_acc_model"
  auto_insert_metric_name: false
  save_weights_only: true
  save_top_k: 1
