# SID Tokenizer (RQ-VAE, PLUM SIDv2 lineage)
# 학습: content embedding (text + cat + brand + price) → RQ-VAE → Semantic ID
# 산출: codebook + item→SID 매핑
#
# Dependency: Task #4 (item_meta) + Task #9 (text embedding) 완료 후 실행 가능.

name: sid_v2
version: v1

seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 30
  deterministic: false           # EMA codebook update 가 비결정적
  num_sanity_val_steps: 0
  enable_progress_bar: true
  log_every_n_steps: 50

model:
  class_path: SIDTokenizerModel
  init_args:
    # latent / codebook (PLUM 기본 multi-resolution)
    latent_dim: 256
    codebook_sizes: [2048, 1024, 512]
    # content
    text_dim: 512                # distiluse-base-multilingual-cased
    image_dim: 0                 # v1 미사용
    cat_emb_dim: 64
    brand_emb_dim: 32
    num_price_buckets: 10
    price_emb_dim: 16
    content_out_dim: 512
    # loss weights
    recon_weight: 1.0
    vq_weight: 1.0
    co_weight: 0.5               # co-occurrence (PLUM 핵심)
    co_temperature: 0.07
    # arch
    encoder_hidden: [512, 256]
    decoder_hidden: [256, 512]
    dropout: 0.1
    commitment_cost: 0.25
    ema_decay: 0.99
    # optim
    lr: 0.001
    weight_decay: 0.0

data:
  class_path: SIDTokenizerDataModule
  init_args:
    base_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full
    num_pairs_per_user: 4
    max_train_pairs: 5_000_000
    num_price_buckets: 10
    batch_size: 4096
    test_batch_size: 2048
    num_workers: 4
    seed: 42

early_stopping:
  monitor: val/sid_uniqueness
  patience: 10
  mode: max

model_ckpt:
  monitor: val/sid_uniqueness
  mode: max
  filename: "best_sid_tokenizer"
  auto_insert_metric_name: false
  save_weights_only: true
  save_top_k: 1
