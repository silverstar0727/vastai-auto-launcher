name: embedding_generator
version: v1
seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 20
  deterministic: true
  callbacks:
    - class_path: WandbAlert
      init_args:
        monitor: ${model_ckpt.monitor}
        mode: ${model_ckpt.mode}

model:
  class_path: EmbeddingGeneratorModel
  init_args:
    net:
      class_path: EmbeddingGeneratorNet
      init_args:
        num_items: 1000000
        item_embed_size: 256
        text_embed_size: 512
        text_project_size: 128
        n_markets: 0
        market_embed_size: 128
        n_categories: 0
        category_embed_size: 128
        use_age_info: false
        num_hidden_layers: 1
        last_hidden_units: 256
        item_dropout_prob: 0.0
        normalize_outputs: false
    num_items: 1000000
    negative_sampling: true
    softmax_temperature: 1.0
    bias_correction: false
    top_k: 50
    lr: 0.001
    optimizer: adam
    weight_decay: 0.0
    lr_scheduler: null
    lr_scheduler_step: 20
    lr_scheduler_gamma: 0.1

data:
  class_path: EmbeddingGeneratorDataModule
  init_args:
    interaction_dir: /home/jeongmindo/projects/data/embedding_generator/interaction
    goods_path: /home/jeongmindo/projects/data/sql/goods.csv
    category_path: /home/jeongmindo/projects/data/sql/category.csv
    standard_category_path: /home/jeongmindo/projects/data/sql/standard_category.csv
    pretrained_text_path: /home/jeongmindo/projects/data/pretrained_text/distiluse-base-multilingual-cased
    order_path: ""
    cache_dir: /home/jeongmindo/projects/data/embedding_generator/cache
    max_len: 200
    batch_size: 1024
    test_batch_size: 1024
    max_items: 1000000
    min_actions_per_user: 50
    max_test_samples: 200000
    num_test_samples_per_user: 10
    negative_sampling: true
    bias_correction: false
    num_workers: 0
    seed: 42

early_stopping:
  monitor: val/NDCG_50
  patience: 5
  mode: max

model_ckpt:
  monitor: val/NDCG_50
  mode: max
  filename: "best-ep={epoch:02d}-ndcg={val/NDCG_50:.4f}"
  auto_insert_metric_name: false
