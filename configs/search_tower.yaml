name: search_tower
version: v1
seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 8
  deterministic: true
  gradient_clip_val: 5
  callbacks:
    - class_path: WandbAlert
      init_args:
        monitor: ${model_ckpt.monitor}
        mode: ${model_ckpt.mode}

model:
  class_path: SearchTowerModel
  init_args:
    net:
      class_path: SearchTowerNet
      init_args:
        num_items: 180000
        item_embed_size: 128
        hidden_units: 256
        max_len: 80
        num_blocks: 2
        num_heads: 4
        dropout: 0.1
        text_embed_size: 512
        query_token_embed_size: 256
        max_query_len: 32
    top_k: 50
    lr: 0.001
    lr_scheduler_step: 4
    lr_scheduler_gamma: 0.1

data:
  class_path: SearchTowerDataModule
  init_args:
    interaction_dir: /home/jeongmindo/projects/data/search_tower/interaction
    search_dir: /home/jeongmindo/projects/data/search_tower/search
    goods_path: /home/jeongmindo/projects/data/sql/goods.csv
    category_path: /home/jeongmindo/projects/data/sql/category.csv
    standard_category_path: /home/jeongmindo/projects/data/sql/standard_category.csv
    pretrained_text_path: /home/jeongmindo/projects/data/pretrained_text/distiluse-base-multilingual-cased
    cache_dir: /home/jeongmindo/projects/data/search_tower/cache
    max_len: 80
    batch_size: 512
    max_items: 180000
    min_actions_per_user: 100
    max_test_samples: 200000
    num_workers: 4
    use_augment: true
    seed: 42

early_stopping:
  monitor: val/NDCG_50
  patience: 5
  mode: max

model_ckpt:
  monitor: val/NDCG_50
  mode: max
  filename: "best-ep={epoch:02d}-ndcg={val/NDCG_50:.4f}"
  auto_insert_metric_name: false
