name: multi_interest
version: v1
seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 10
  deterministic: true
  callbacks:
    - class_path: WandbAlert
      init_args:
        monitor: ${model_ckpt.monitor}
        mode: ${model_ckpt.mode}

model:
  class_path: MultiInterestModel
  init_args:
    net:
      class_path: MultiInterestNet
      init_args:
        num_items: 180000
        num_categories: 1024
        embedding_size: 128
        attention_size: 8
        interest_count: 4
        max_len: 80
        use_item_bias: true
        soft_selection: false
    top_k: 10
    lr: 0.001
    weight_decay: 0
    lr_scheduler: step
    lr_scheduler_step: 4
    lr_scheduler_gamma: 0.1

data:
  class_path: MultiInterestDataModule
  init_args:
    interaction_dir: /home/jeongmindo/projects/data/multi_interest/interaction
    goods_path: /home/jeongmindo/projects/data/multi_interest/sql/goods.csv
    category_path: /home/jeongmindo/projects/data/multi_interest/sql/category.csv
    standard_category_path: /home/jeongmindo/projects/data/multi_interest/sql/standard_category.csv
    order_path: /home/jeongmindo/projects/data/multi_interest/sql/order.csv
    cache_dir: /home/jeongmindo/projects/data/multi_interest/cache
    max_len: 80
    batch_size: 2048
    test_batch_size: 64
    max_items: 180000
    min_actions_per_user: 100
    max_test_samples: 200000
    num_train_sample_per_user: 60
    preference_event_weight: 5.0
    num_workers: 0
    seed: 42

early_stopping:
  monitor: val/NDCG_10
  patience: 5
  mode: max

model_ckpt:
  monitor: val/NDCG_10
  mode: max
  filename: "best-ep={epoch:02d}-ndcg={val/NDCG_10:.4f}"
  auto_insert_metric_name: false
