name: bert
version: v1
seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 10
  deterministic: true
  callbacks:
    - class_path: WandbAlert
      init_args:
        monitor: ${model_ckpt.monitor}
        mode: ${model_ckpt.mode}

model:
  class_path: BertModel
  init_args:
    net:
      class_path: BERT4Rec
      init_args:
        num_items: 179998
        max_len: 80
        num_blocks: 2
        num_heads: 4
        hidden_units: 256
        item_embed_size: 64
        dropout: 0.1
        text_embed_size: 512
    top_k: 10

data:
  class_path: BertDataModule
  init_args:
    interaction_dir: /home/jeongmindo/projects/data/bert/interaction
    goods_path: /home/jeongmindo/projects/data/sql/goods.csv
    category_path: /home/jeongmindo/projects/data/sql/category.csv
    pretrained_text_path: /home/jeongmindo/projects/data/pretrained_text/distiluse-base-multilingual-cased
    order_path: /home/jeongmindo/projects/data/sql/order.csv
    cache_dir: /home/jeongmindo/projects/data/bert/cache
    max_len: 80
    mask_prob: 0.15
    batch_size: 32
    max_items: 180000
    min_actions_per_user: 100
    max_test_samples: 200000
    num_workers: 0
    seed: 42

optimizer:
  class_path: Adam
  init_args:
    lr: 0.001

lr_scheduler:
  class_path: StepLR
  init_args:
    step_size: 5
    gamma: 0.1

early_stopping:
  monitor: val/NDCG_10
  patience: 5
  mode: max

model_ckpt:
  monitor: val/NDCG_10
  mode: max
  filename: "best-ep={epoch:02d}-ndcg={val/NDCG_10:.4f}"
  auto_insert_metric_name: false
