# HSTU two-tower — Two-tower path 의 핵심 학습 config
# Dependency: meta/active_items.parquet + interactions/{train,val,test}/ (Tasks #2, #3 완료됨)

name: hstu_two_tower
version: v1

seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 30
  deterministic: false
  num_sanity_val_steps: 0
  enable_progress_bar: true
  log_every_n_steps: 100

model:
  class_path: HSTUTwoTowerModel
  init_args:
    dim: 256
    num_layers: 4
    num_heads: 8
    ff_dim: 1024
    num_interests: 4
    attention_dim: 64
    item_content_dim: 0          # v1 — 사전학습 임베딩 join 은 v2 (HSTU 자체 학습 임베딩만)
    dropout: 0.1
    lr: 0.001
    weight_decay: 0.0
    eval_ks: [10, 50]

data:
  class_path: HSTUSequentialDataModule
  init_args:
    base_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full
    max_seq_len: 200
    min_seq_len: 5
    batch_size: 256
    eval_batch_size: 128
    num_workers: 4
    # PoC 1차: 전체 98 train 일 중 최근 14일만 사용 (debug-friendly)
    # 안정화 후 전체로 확장
    train_days: 14
    val_days: 7
    test_days: 16

early_stopping:
  monitor: val/Recall@10
  patience: 5
  mode: max

model_ckpt:
  monitor: val/Recall@10
  mode: max
  filename: "best_hstu_two_tower"
  auto_insert_metric_name: false
  save_weights_only: true
  save_top_k: 1
