# SID Tokenizer (RQ-VAE) — PoC v2_full 본격 학습
# 데이터: 1.4M active items, distiluse 512-d 텍스트 임베딩 사전 추출.

name: sid_v2
version: v1

seed_everything: 42

trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 50
  deterministic: false
  num_sanity_val_steps: 0
  enable_progress_bar: true
  log_every_n_steps: 50
  callbacks:
    - class_path: SaveSIDMapCallback
      init_args:
        output_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full/meta

model:
  class_path: SIDTokenizerModel
  init_args:
    # latent / codebook — PLUM SIDv2 표준 multi-resolution
    # v3 (1024×512×256, 130M 조합) 에서 uniqueness 0.71 에서 saturation 발생
    # (lvl0 utilization 89%까지 잘 활용됐으나 codebook capacity 자체 한계).
    # PLUM 표준 크기로 복귀: 2048×1024×512 = ~1B 조합 (1.4M items 에 충분 여유).
    # v3 에서 검증된 data init + dead code restart 가 큰 codebook collapse 도 방지할 것.
    latent_dim: 384
    codebook_sizes: [2048, 1024, 512]   # ~1B unique SID combinations
    # content
    text_dim: 512
    image_dim: 0
    cat_emb_dim: 64
    brand_emb_dim: 48
    num_price_buckets: 10
    price_emb_dim: 16
    content_out_dim: 512
    # losses
    recon_weight: 1.0
    vq_weight: 1.0
    co_weight: 0.5                 # PLUM ablation: 가장 큰 lift
    co_temperature: 0.07
    # arch (encoder/decoder capacity 키움)
    encoder_hidden: [768, 384]
    decoder_hidden: [384, 768]
    dropout: 0.1
    commitment_cost: 0.25
    ema_decay: 0.95              # 0.99 → 0.95 (더 빠른 codebook 적응)
    # optim + cosine schedule
    lr: 0.001
    weight_decay: 0.0
    warmup_epochs: 3
    eta_min: 0.00001

data:
  class_path: SIDTokenizerDataModule
  init_args:
    base_dir: /home/jeongmindo/projects/ably/data/reco_experiments/v2_full
    num_pairs_per_user: 8         # 4 → 8
    max_train_pairs: 20_000_000   # 5M → 20M (PoC 적정)
    num_price_buckets: 10
    batch_size: 16384             # 8192 → 16384 (k-means init 품질 + 속도)
    test_batch_size: 8192
    num_workers: 4
    seed: 42

early_stopping:
  monitor: val/sid_uniqueness
  patience: 8
  mode: max

model_ckpt:
  monitor: val/sid_uniqueness
  mode: max
  filename: "best_sid_tokenizer"
  auto_insert_metric_name: false
  save_weights_only: true
  save_top_k: 1
